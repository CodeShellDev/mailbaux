name: Build & Push Image

on:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: codeshelldev/gh-actions/docker-build-push@v1
        with:
          registry: ghcr.io
          token: ${{ secrets.GITHUB_TOKEN }}
          use-qemu: "true"
