name: Build & Push Dev Image

on:
  push:
    branches:
      - dev
    paths-ignore:
      - .**
      - examples/**
      
jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: codeshelldev/gh-actions/docker-build-push@main
        with:
          registry: ghcr.io
          token: ${{ secrets.GITHUB_TOKEN }}
          use-qemu: 'true'
          flavor: |
            latest=false
          tags: |
            type=sha
            type=raw,value=latest-dev
